[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "addmai"
version = "0.1.0"
description = "AI-Powered Deepfake Detection & Media Authenticity Intelligence"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "ADDMAI Engineering Team" }
]
# Authoritative project dependencies (Stage 1 & reserved baseline)
dependencies = [
    # Actively used in Stage 1/1.1 foundation:
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    # Reserved dependencies for upcoming stages (Stage 2 Storage, Stage 3 Database, Stage 8 Workers):
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "redis>=5.0.2",
    "aioboto3>=12.3.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["apps/api/tests", "tests"]
asyncio_mode = "auto"
pythonpath = ["apps/api"]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP"   # pyupgrade
]
ignore = ["E501"]
